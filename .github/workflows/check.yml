# Runs the editor checklist on every pull request and push to main. Cloudflare (Workers Builds) builds and deploys;
# this only fails a PR that would break under nysfocus.com/interactives/<slug>/ or break the newsroom's rules.
name: Checklist

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm test
      # A project's own tests (its parser, its server routes), if it has them: "test:project" in package.json. Their
      # dependencies install from package-lock.json, if there is one.
      - run: if [ -f package-lock.json ]; then npm ci; fi
      - run: npm run test:project --if-present
